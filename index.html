<style>
:root{--bg:#eef1f8;--card:#fff;--ink:#141a2b;--sub:#5d6680;--line:#d9dfee;--brand:#2f4a8f;--heroA:#1b2a55;--heroB:#253c78;--heroC:#2f4a8f;--bad:#b3261e;--field:#f5f7fc}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1220;--card:#171d2e;--ink:#e6eaf5;--sub:#9aa4bf;--line:#2a3350;--brand:#4a67b3;--heroA:#0b1330;--heroB:#14214a;--heroC:#1f3168;--bad:#f2a49d;--field:#1c2338}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-text-size-adjust:100%}
.top{background:linear-gradient(160deg,var(--heroA),var(--heroB) 60%,var(--heroC));height:38vh;min-height:220px;border-radius:0 0 28px 28px}
.wrap{max-width:420px;margin:-120px auto 0;padding:0 16px 40px}
.card{background:var(--card);border-radius:20px;padding:26px 22px 22px;box-shadow:0 10px 30px rgba(14,22,48,.16)}
.lock{width:52px;height:52px;border-radius:16px;background:linear-gradient(160deg,var(--heroB),var(--heroC));display:grid;place-items:center;margin-bottom:14px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
p{margin:0 0 18px;color:var(--sub);font-size:14px;line-height:1.5}
label.f{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);outline:none}
input[type=password]:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,74,143,.2)}
button{width:100%;font:inherit;font-size:16px;font-weight:600;padding:14px;border:0;border-radius:12px;background:var(--brand);color:#fff;cursor:pointer;margin-top:18px}
button:disabled{opacity:.6}
.msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--bad)}
.u{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
</style>
</head>
<body>
<div class="top"></div>
<div class="wrap">
  <form class="card" id="f" autocomplete="on">

    <h1>수첩</h1>
    <p>암호를 넣으면 이 기기 안에서만 풀립니다.</p>
    <input class="u" type="text" name="username" autocomplete="username" value="dash" tabindex="-1" aria-hidden="true">
    <label class="f" for="pw">암호</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button id="go" type="submit">열기</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>
</div>

<script>
(function () {
  var ENV = JSON.parse(document.getElementById('env').textContent);
  var $ = function (id) { return document.getElementById(id); };
  var NAME = '수첩';
  /*<open>*/
  var te = new TextEncoder();
  function b64(s) { var r = atob(s), u = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) u[i] = r.charCodeAt(i); return u; }
  function derive(pw) {
    return crypto.subtle.importKey('raw', te.encode(pw.normalize('NFC')), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(ENV.s), iterations: ENV.i }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    });
  }
  function open(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENV.n), additionalData: te.encode('s1') }, key, b64(ENV.c));
  }
  function unpack(buf) {                // 봉투 z=1: u32 길이 ‖ zlib(RFC 1950 = 'deflate') ‖ 0 채움(4 KiB 배수) — 길이·채움·끝을 엄격히
    var u = new Uint8Array(buf), n = (u[0] | (u[1] << 8) | (u[2] << 16) | (u[3] << 24)) >>> 0;
    if (ENV.z !== 1 || u.length < 4096 || u.length % 4096 || n < 2 || 4 + n > u.length) return Promise.reject(new Error('shape'));
    for (var i = 4 + n; i < u.length; i++) if (u[i] !== 0) return Promise.reject(new Error('shape'));
    return new Response(new Blob([u.subarray(4, 4 + n)]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer().then(function (b) {
      var t = new TextDecoder('utf-8', { fatal: true }).decode(b), j = t.indexOf('\n');
      if (j < 1) throw new Error('head');
      var head = JSON.parse(t.slice(0, j));
      if (!head || head.v !== 1 || typeof head.seq !== 'number') throw new Error('head');
      return { head: head, html: t.slice(j + 1) };
    });
  }
  /*</open>*/
  /*<band-state>*/
  var KST = 9 * 36e5, DAY = 864e5;
  function workHours(from, now) {       // 한국 시각 일요일 시간은 빼고 셈(PC 가 일요일엔 꺼짐 — 가짜 주황 0)
    var a = from + KST, b = now + KST, sun = 0;
    if (!(b > a)) return 0;
    for (var d = Math.floor(a / DAY); d <= Math.floor(b / DAY); d++) {
      if (new Date(d * DAY).getUTCDay() !== 0) continue;
      var s = Math.max(a, d * DAY), e = Math.min(b, (d + 1) * DAY);
      if (e > s) sun += e - s;
    }
    return (b - a - sun) / 36e5;
  }
  function mdhm(ms) {
    var t = new Date(ms + KST);
    return (t.getUTCMonth() + 1) + '/' + t.getUTCDate() + ' ' + ('0' + t.getUTCHours()).slice(-2) + ':' + ('0' + t.getUTCMinutes()).slice(-2);
  }
  function ago(h) { return h < 1 ? '방금' : h < 48 ? Math.floor(h) + '시간 전' : Math.floor(h / 24) + '일 전'; }
  function bandState(head, now) {
    var d = Date.parse(head.data_at), u = Date.parse(head.at), lim = typeof head.stale === 'number' && head.stale > 0 ? head.stale : 26;
    if (!(d > 0) || !(u > 0) || typeof head.seq !== 'number' || typeof head.run !== 'string') return null;
    var stale = workHours(d, now) > lim;
    return { stale: stale, text: '판 #' + head.seq + ' · 자료 ' + mdhm(d) + ' (run ' + head.run + ') · ' + ago((now - d) / 36e5)
      + ' · 올림 ' + mdhm(u) + (stale ? ' · 오래됨 — 그 뒤 판이 안 올라왔을 수 있음' : '') };
  }
  /*</band-state>*/
  var CSS = '@media (max-width: 559px) { .kpi.hero { grid-column: 1 / -1; } .hero .kv { overflow-wrap: normal; } }\n'
    + '#n8band{position:sticky;top:0;z-index:50;margin:0;padding:6px 12px;font:12.5px/1.45 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;'
    + 'background:#e8edf8;color:#1b2a55;border-bottom:1px solid #c8d2ec;overflow-wrap:anywhere}\n'
    + '#n8band.old{background:#fff0dc;color:#7a3f00;border-bottom-color:#f0b46b}\n'
    + '@media (prefers-color-scheme: dark){#n8band{background:#18213d;color:#d4dcf2;border-bottom-color:#2c3a63}#n8band.old{background:#3a2408;color:#ffcf99;border-bottom-color:#8a5a1c}}';
  function show(r, ms) {
    window.__unlock = { ms: ms };
    document.open(); document.write(r.html); document.close();
    var bar = null;
    try {                               // 띠는 write 뒤 DOM 으로 맨 위에 — 리스너·시계도 document.open 뒤에 단다
      document.title = NAME;
      var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      bar = document.createElement('div'); bar.id = 'n8band'; bar.setAttribute('role', 'status');
      document.body.insertBefore(bar, document.body.firstChild);
      var paint = function () {
        var s = null;
        try { s = bandState(r.head, Date.now()); } catch (e) { s = null; }
        bar.textContent = s ? s.text + ' · 푸는 데 ' + ms + ' ms' : '판 정보를 못 붙임';
        bar.className = s && !s.stale ? '' : 'old';
      };
      paint();
      setInterval(paint, 60000);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) paint(); });
      window.addEventListener('pageshow', paint);
    } catch (e) {
      try { if (!bar || !bar.parentNode) { bar = document.createElement('div'); bar.textContent = '판 정보를 못 붙임'; document.body.insertBefore(bar, document.body.firstChild); } } catch (e2) { }
    }
  }
  function fail(text) {
    $('go').disabled = false; $('go').textContent = '열기';
    $('msg').textContent = text;
    $('pw').select();
  }
  if (!(window.isSecureContext && window.crypto && crypto.subtle)) {
    $('msg').textContent = '이 화면에서는 풀 수 없습니다 — https 주소(또는 PC에서 파일로) 여세요.';
    $('go').disabled = true; return;
  }
  if (typeof DecompressionStream !== 'function') {
    $('msg').textContent = '이 브라우저에서는 풀 수 없습니다(압축 풀기 없음) — 2023년 이후 크롬·사파리로 여세요.';
    $('go').disabled = true; return;
  }
  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = $('pw').value.replace(/\s+/g, ''); if (!pw) return;
    $('go').disabled = true; $('msg').textContent = ''; $('go').textContent = '푸는 중…';
    var t0 = performance.now();
    derive(pw).then(open).then(function (pt) {
      return unpack(pt).then(function (r) {
        show(r, Math.round(performance.now() - t0));
      }, function () {
        fail('암호는 맞지만 판을 풀지 못했습니다 — 판이 깨졌을 수 있습니다. 다음 판을 기다리세요.');
      });
    }, function () {
      fail('풀리지 않습니다 — 암호가 다르거나 파일이 바뀌었습니다.');
    });
  });
})();
